name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run build:web
      - name: Apply D1 migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply scopebeacon-production --remote
      - name: Deploy Worker and static assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo 'Deployment skipped: add the CLOUDFLARE_API_TOKEN repository secret to enable GitHub-driven deployment.'
