name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run build
      - name: Prepare local Worker secret
        run: printf '%s\n' 'RATE_LIMIT_SECRET=ci-only-local-test-secret-32-bytes-minimum' > .dev.vars
      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply scopebeacon-production --local
      - name: Start local Cloudflare Worker
        run: npx wrangler dev --local --port 8787 --ip 127.0.0.1 > /tmp/scopebeacon-worker.log 2>&1 & echo $! > /tmp/scopebeacon-worker.pid
      - name: Smoke test Worker and D1
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          WORKER_SMOKE_URL=http://127.0.0.1:8787 npm run smoke:worker
